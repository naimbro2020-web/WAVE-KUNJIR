<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WAVE System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: mobile = app dengan bottom-nav (seperti mockup); >=960px = sidebar + dashboard multi-kolom */
:root{
  --bg:#E9F0F3; --surface:#FFFFFF; --surface-2:#F1F6F8; --ink:#10303B; --muted:#587680; --line:#D7E3E8;
  --brand:#0B5D70; --on-brand:#FFFFFF; --teal-text:#0B5D70; --accent:#F26A1B;
  --ai-bg:#DCEBEF; --sheet-bg:linear-gradient(180deg,#FDECEC 0%,#F1F7F9 46%);
  --shadow:0 1px 2px rgba(16,48,59,.06),0 8px 20px rgba(16,48,59,.06);
  --aman:#1E9E6A; --aman-soft:#DDF3E8; --aman-ink:#0C6A46;
  --waspada:#D9A400; --waspada-soft:#FBF0CC; --waspada-ink:#6F5000;
  --siaga:#F26A1B; --siaga-soft:#FDE8DA; --siaga-ink:#B24508;
  --awas:#D93636; --awas-soft:#FBDFDF; --awas-ink:#A31F1F;
  --font-display:'Sora','Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gutter-l:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08171C; --surface:#0F2730; --surface-2:#143240; --ink:#E4F0F3; --muted:#8CA9B2; --line:#1E414D;
    --brand:#177E96; --on-brand:#FFFFFF; --teal-text:#5DC7DD; --accent:#FF8545;
    --ai-bg:#123340; --sheet-bg:linear-gradient(180deg,#2A171B 0%,#0F2730 46%);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.3);
    --aman:#35C48A; --aman-soft:#11382A; --aman-ink:#6FDDAA;
    --waspada:#F0BE2E; --waspada-soft:#3A3010; --waspada-ink:#F4CE62;
    --siaga:#FF8545; --siaga-soft:#3D2216; --siaga-ink:#FFA070;
    --awas:#FF6B6B; --awas-soft:#3F1A1E; --awas-ink:#FF9494;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08171C; --surface:#0F2730; --surface-2:#143240; --ink:#E4F0F3; --muted:#8CA9B2; --line:#1E414D;
  --brand:#177E96; --on-brand:#FFFFFF; --teal-text:#5DC7DD; --accent:#FF8545;
  --ai-bg:#123340; --sheet-bg:linear-gradient(180deg,#2A171B 0%,#0F2730 46%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.3);
  --aman:#35C48A; --aman-soft:#11382A; --aman-ink:#6FDDAA;
  --waspada:#F0BE2E; --waspada-soft:#3A3010; --waspada-ink:#F4CE62;
  --siaga:#FF8545; --siaga-soft:#3D2216; --siaga-ink:#FFA070;
  --awas:#FF6B6B; --awas-soft:#3F1A1E; --awas-ink:#FF9494;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;min-height:100%;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible+.chk-box{outline:3px solid var(--teal-text);outline-offset:2px;border-radius:10px}
svg.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3,p{margin:0}
.tone-ok{color:var(--aman-ink)} .tone-warn{color:var(--siaga-ink)} .tone-info{color:var(--teal-text)} .tone-crit{color:var(--awas-ink)}
[data-lv="aman"]{--lv:var(--aman);--lv-soft:var(--aman-soft);--lv-ink:var(--aman-ink)}
[data-lv="waspada"]{--lv:var(--waspada);--lv-soft:var(--waspada-soft);--lv-ink:var(--waspada-ink)}
[data-lv="siaga"]{--lv:var(--siaga);--lv-soft:var(--siaga-soft);--lv-ink:var(--siaga-ink)}
[data-lv="awas"]{--lv:var(--awas);--lv-soft:var(--awas-soft);--lv-ink:var(--awas-ink)}

/* shell */
.app{min-height:100%;display:block}
.side{display:none}
.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent}
.top-in{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:10px var(--gutter-r) 10px var(--gutter-l);max-width:720px;margin:0 auto}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--teal-text);font-size:20px}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.ttl{text-align:center;min-width:0}
.ttl b{display:block;font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.04em;color:var(--teal-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.top-extra{display:none}
.page{padding:6px var(--gutter-r) 112px var(--gutter-l);max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px var(--gutter-r) calc(8px + env(safe-area-inset-bottom,0px)) var(--gutter-l);display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:10.5px;font-weight:600;min-width:0}
.tb .ic{font-size:21px}
.tb span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb.on{color:var(--teal-text)}
.tb.on .ic{stroke-width:2.4}

/* common */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.sec{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--teal-text)}
.sec .ic{font-size:18px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--lv-soft);color:var(--lv-ink);font-size:11px;font-weight:800;letter-spacing:.06em}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lv)}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--tone,var(--brand))}
.bar.tone-ok{--tone:var(--aman)} .bar.tone-warn{--tone:var(--siaga)} .bar.tone-info{--tone:var(--brand)} .bar.tone-crit{--tone:var(--awas)} .bar.tone-lv{--tone:var(--lv)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;font-weight:700;font-size:13px}
.btn.primary{background:var(--brand);color:var(--on-brand);min-height:50px;font-family:var(--font-display);letter-spacing:.06em;font-size:14px}
.btn.ghost{background:var(--surface-2);color:var(--teal-text)}
.btn.warn{background:var(--siaga-soft);color:var(--siaga-ink)}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.seg-b{flex:1;min-height:36px;padding:0 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg-b.on{background:var(--surface);color:var(--teal-text);box-shadow:var(--shadow)}

/* home */
.home-top{display:grid;gap:12px}
.status{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;width:100%;padding:24px 16px 22px;border-radius:16px;background:var(--lv-soft);border:3px solid var(--lv)}
.status .eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--lv-ink)}
.status .lvl{font-family:var(--font-display);font-weight:800;font-size:clamp(2.7rem,11vw,3.7rem);line-height:1.05;color:var(--lv);letter-spacing:.01em}
.status .lvd{font-weight:600;font-size:15px;max-width:26ch;text-wrap:balance}
.aside-card{padding:16px;display:flex;flex-direction:column;gap:12px}
.rk-num{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.rk-num b{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1}
.rk-num span.of{color:var(--muted);font-weight:600}
.rk-num .pill{margin-left:auto}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1 1 140px}
.updated{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:500;justify-content:center}
.updated .ic{font-size:14px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--aman);box-shadow:0 0 0 0 var(--aman);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sensor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.scard{padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.scard .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--teal-text);font-size:19px;margin-bottom:6px}
.slabel{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.sval{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.sval small{font-size:14px;font-weight:700;margin-left:2px}
.sst{font-size:12px;font-weight:700}
.ssrc{margin-top:4px;font-size:10px;color:var(--muted);letter-spacing:.04em}

/* monitoring */
.ai{background:var(--ai-bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ai h3{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-text);font-weight:800}
.ai p{font-size:13.5px;font-weight:500;border-left:3px solid var(--awas);padding-left:10px}
.charts{display:grid;gap:14px}
.chart{padding:16px 14px 10px}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.ch-head .big{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:800;background:var(--surface-2);white-space:nowrap}
.badge.tone-warn{background:var(--siaga-soft)} .badge.tone-ok{background:var(--aman-soft)} .badge.tone-info{background:var(--ai-bg)}
.chart-el{width:100%;min-height:176px}
.chart-el svg{display:block;width:100%;height:auto;overflow:visible}
.c-grid{stroke:var(--line);stroke-width:1}
.c-txt{fill:var(--muted);font-size:10px;font-weight:600;font-family:var(--font-body)}
.c-txt.now{fill:var(--ink);font-weight:800}
.c-line{fill:none;stroke:var(--brand);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.c-dot{fill:var(--brand);stroke:var(--surface);stroke-width:3}
.c-anom{stroke:var(--awas);stroke-width:1.5;stroke-dasharray:3 3}
.c-bdg{fill:var(--awas)}
.c-bdg-t{fill:#fff;font-size:9px;font-weight:800;letter-spacing:.04em;font-family:var(--font-body)}

/* risk */
.risk-wrap{display:grid;gap:14px}
.gauge-card{padding:22px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.gauge{position:relative;width:min(240px,70vw);aspect-ratio:1}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.g-track{fill:none;stroke:var(--surface-2);stroke-width:16}
.g-arc{fill:none;stroke:var(--lv);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.g-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.g-mid b{font-family:var(--font-display);font-size:clamp(46px,16vw,60px);font-weight:800;line-height:1}
.g-mid span.of{color:var(--muted);font-weight:600;font-size:13px}
.gauge-card p{max-width:34ch;color:var(--muted);font-size:13.5px}
.factors{padding:16px;display:flex;flex-direction:column;gap:14px}
.factor{display:flex;flex-direction:column;gap:7px;padding:12px;border-radius:12px;background:var(--surface-2)}
.f-row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.f-row span{font-weight:600}
.f-row b{text-align:right}
.factor .bar{background:var(--line)}

/* reports */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{padding:14px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--font-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat b small{font-size:12px;font-weight:700;margin-left:2px;color:var(--muted)}
.log{padding:6px 16px;display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--lv-soft);color:var(--lv-ink);font-size:18px}
.ev b{display:block;font-size:13.5px}
.ev small{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--muted);font-size:12px;margin-top:2px}
.note{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.note .ic{font-size:14px}

/* profile */
.prof-grid{display:grid;gap:14px}
.hd-card{padding:16px;display:flex;flex-direction:column;gap:12px}
.hd-id{display:flex;gap:12px;align-items:center}
.hd-id .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);font-size:24px}
.hd-id b{font-family:var(--font-display);font-size:16px;display:block}
.hd-id small{color:var(--muted);display:flex;align-items:center;gap:4px;font-size:12.5px}
.kv{display:grid;gap:8px;font-size:13px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding-top:8px;border-top:1px solid var(--line)}
.kv span{color:var(--muted)}
.kv b{text-align:right}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--teal-text);font-size:17px}
.row b{display:block;font-size:13.5px}
.row small{display:block;color:var(--muted);font-size:12px}
.on-tag{font-size:11px;font-weight:800;color:var(--aman-ink);background:var(--aman-soft);padding:3px 9px;border-radius:99px}
.on-tag.act{color:var(--siaga-ink);background:var(--siaga-soft)}
.set{padding:16px;display:flex;flex-direction:column;gap:14px}
.set-row{display:flex;flex-direction:column;gap:8px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600;font-size:13.5px}
.tg{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line);transition:background .2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg[aria-checked="true"]{background:var(--brand)}
.tg[aria-checked="true"]::after{transform:translateX(20px)}
.emg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-radius:14px;background:var(--surface-2);color:var(--teal-text);font-weight:700;font-size:13px;text-decoration:none;width:100%}
.emg span{display:flex;align-items:center;gap:8px;min-width:0}
.emg b{font-family:var(--font-display);font-size:16px;color:var(--ink)}

/* sheets */
.sheet-root{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,22,28,.55);padding-top:env(safe-area-inset-top,0px)}
.sheet{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--sheet-bg);background-color:var(--surface);border-radius:24px 24px 0 0;padding:20px var(--gutter-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gutter-l);display:flex;flex-direction:column;gap:16px;animation:rise .28s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-warn{display:flex;align-items:center;gap:8px;color:var(--awas-ink);font-weight:800;letter-spacing:.06em;font-size:13px}
.sh-warn .ic{font-size:20px}
.live{font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 9px;border-radius:99px;background:var(--awas-soft);color:var(--awas-ink)}
.sheet h2{font-family:var(--font-display);font-weight:800;font-size:26px;text-align:center;letter-spacing:.02em}
.sh-msg{padding:16px;text-align:center;font-weight:500;font-size:14.5px;line-height:1.55}
.sh-sub{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--teal-text)}
.checks{display:flex;flex-direction:column;gap:10px}
.chk{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font-weight:600;font-size:14px}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:transparent;font-size:15px}
.chk input:checked+.chk-box{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chk input:checked~span.t{text-decoration:line-through;color:var(--muted)}
.menu-card{padding:4px 0;display:flex;flex-direction:column;gap:16px}

/* login */
.login-root{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px var(--gutter-r) 24px var(--gutter-l);background:var(--bg);overflow-y:auto}
.login{width:100%;max-width:400px;padding:28px 22px;display:flex;flex-direction:column;gap:18px}
.brand-l{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.brand-l i{width:56px;height:56px;border-radius:18px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:30px;font-style:normal}
.brand-l h1{font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--teal-text);letter-spacing:.03em}
.brand-l .sub{color:var(--muted);font-size:13px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld input{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 14px;font:inherit;font-size:15px;width:100%}
.fld input:focus-visible{outline:3px solid var(--teal-text);outline-offset:1px}
.err{background:var(--awas-soft);color:var(--awas-ink);padding:10px 12px;border-radius:10px;font-size:12.5px;font-weight:600}

/* responsive */
@media (min-width:600px){
  .sensor-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sheet-root{align-items:center}
  .sheet{border-radius:24px}
}
@media (min-width:960px){
  .app{display:grid;grid-template-columns:260px minmax(0,1fr)}
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:20px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow-y:auto;padding:24px 16px 24px var(--gutter-l);background:var(--surface);border-right:1px solid var(--line);min-height:100vh}

  },
  current() { try { const s = JSON.parse(localStorage.getItem(this.KEY) || 'null'); return s && s.email ? s : null; } catch (e) { return null; } },
  logout() { try { localStorage.removeItem(this.KEY); } catch (e) {} }
};

/* ============================ GRAFIK ============================ */
function smooth(p) {
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function xLabels(n) {
  const r = state.range, base = new Date(DATA.updatedAt), out = [];
  if (r === 'day') { [0, 6, 12, 18].forEach(h => out.push({ i: h, s: String(h).padStart(2, '0') + ':00' })); out.push({ i: n - 1, s: t('now'), now: true }); }
  else if (r === 'week') { for (let i = 0; i < n; i++) { const d = new Date(base); d.setDate(d.getDate() - (n - 1 - i)); out.push({ i, s: d.toLocaleDateString(loc(), { weekday: 'short' }), now: i === n - 1 }); } }
  else { [0, 7, 14, 21].forEach(i => { const d = new Date(base); d.setDate(d.getDate() - (n - 1 - i)); out.push({ i, s: d.toLocaleDateString(loc(), { day: 'numeric', month: 'short' }) }); }); out.push({ i: n - 1, s: t('now'), now: true }); }
  return out;
}
function drawChart(el) {
  const key = el.dataset.key, cfg = DATA.charts[key], vals = cfg[state.range], n = vals.length;
  const w = Math.max(240, el.clientWidth || 300), h = 176, pl = 38, pr = 14, pt = 14, pb = 28;
  const [lo, hi] = cfg.domain;
  const x = i => pl + i * (w - pl - pr) / (n - 1), y = v => pt + (1 - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo)) * (h - pt - pb);
  const pts = vals.map((v, i) => [x(i), y(v)]);
  const line = smooth(pts), yb = h - pb;
  const fmt = v => (Math.abs(v) >= 100 ? String(Math.round(v)) : String(+v.toFixed(2)));
  let g = cfg.ticks.map(tk => `<line class="c-grid" x1="${pl}" x2="${w - pr}" y1="${y(tk).toFixed(1)}" y2="${y(tk).toFixed(1)}"/><text class="c-txt" x="${pl - 6}" y="${(y(tk) + 3.5).toFixed(1)}" text-anchor="end">${fmt(tk)}</text>`).join('');
  const labels = xLabels(n).map((l, k, arr) => {
    const anchor = l.i === 0 ? 'start' : l.i === n - 1 ? 'end' : 'middle';
    return `<text class="c-txt${l.now ? ' now' : ''}" x="${x(l.i).toFixed(1)}" y="${h - 8}" text-anchor="${anchor}">${l.s}</text>`;
  }).join('');
  let anom = '';
  const ai = cfg.anomaly && cfg.anomaly[state.range];
  if (ai != null) {
    const ax = x(ai), bw = 66, bx = Math.min(w - pr - bw, Math.max(pl, ax - bw / 2));
    anom = `<line class="c-anom" x1="${ax.toFixed(1)}" x2="${ax.toFixed(1)}" y1="${pt + 14}" y2="${yb}"/><rect class="c-bdg" x="${bx.toFixed(1)}" y="${pt - 8}" width="${bw}" height="18" rx="4"/><text class="c-bdg-t" x="${(bx + bw / 2).toFixed(1)}" y="${pt + 4.5}" text-anchor="middle">${t('anom')}</text>`;
  }
  const last = pts[n - 1];
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${t('c_' + key)}: ${cfg.value}">
    <defs><linearGradient id="gr-${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--brand);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--brand);stop-opacity:0"/></linearGradient></defs>
    ${g}<path d="${line}L${last[0].toFixed(1)},${yb}L${pts[0][0].toFixed(1)},${yb}Z" fill="url(#gr-${key})"/>
    ${anom}<path class="c-line" d="${line}"/><circle class="c-dot" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5"/>${labels}</svg>`;
}
let rafId = 0;
function drawCharts() { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(() => $$('.chart-el').forEach(drawChart)); }
if ('ResizeObserver' in window) new ResizeObserver(drawCharts).observe($('#view'));
window.addEventListener('resize', drawCharts);

/* ============================ RENDER ============================ */
const RENDER = { home: viewHome, monitoring: viewMonitoring, risk: viewRisk, reports: viewReports, profile: viewProfile };
function render() {

function go(v, push = true) {
  if (!VIEWS.includes(v)) v = 'home';
  state.view = v;
  if (push) { try { history.replaceState(null, '', '#' + HASH[v]); } catch (e) {} }
  render(); window.scrollTo(0, 0);
}
function fromHash() {
  let h = ''; try { h = location.hash.replace('#', ''); } catch (e) {}
  const v = Object.keys(HASH).find(k => HASH[k] === h);
  state.view = v || 'home';
}

/* ============================ EVENT ============================ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (e.target.id === 'sheetRoot') { state.sheet = null; renderSheet(); } return; }
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'nav') go(v);
  else if (a === 'range') { state.range = v; render(); }
  else if (a === 'lang') { state.lang = v; try { localStorage.setItem('wave.lang', v); } catch (x) {} render(); }
  else if (a === 'theme') { state.theme = v; try { localStorage.setItem('wave.theme', v); } catch (x) {} render(); }
  else if (a === 'alert') { state.sheet = 'alert'; renderSheet(); }
  else if (a === 'menu') { state.sheet = 'menu'; renderSheet(); }
  else if (a === 'close') { state.sheet = null; renderSheet(); }
  else if (a === 'ack') { state.acked = true; state.sheet = null; render(); }
  else if (a === 'notif') { state.notif = !state.notif; render(); }
  else if (a === 'login') doLogin();
  else if (a === 'logout') { AUTH.logout(); state.user = null; state.acked = false; state.loginErr = ''; render(); }
  else if (a === 'test') { state[v] = true; render(); setTimeout(() => { state[v] = false; render(); }, 3000); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest && e.target.closest('#loginForm') && e.target.tagName === 'INPUT') { e.preventDefault(); doLogin(); }
});
async function doLogin() {
  const email = $('#lgEmail').value.trim(), pw = $('#lgPw').value;
  state.loginEmail = email;
  if (!email || !pw) { state.loginErr = 'login_empty'; render(); return; }
  const u = await AUTH.login(email, pw);
  if (u) { state.user = u; state.loginErr = ''; state.loginEmail = ''; fromHash(); render(); window.scrollTo(0, 0); }
  else { state.loginErr = 'login_err'; render(); }
}
document.addEventListener('change', e => {
  const c = e.target.closest('input[data-i]');
  if (c) state.checks[+c.dataset.i] = c.checked;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sheet) { state.sheet = null; renderSheet(); } });
window.addEventListener('hashchange', () => { fromHash(); render(); });
setInterval(() => $$('.js-updated').forEach(n => { n.textContent = rel(); }), 20000);

/* ============================ API UNTUK BACKEND ============================ */
function merge(a, b) { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') merge(a[k], b[k]); else a[k] = b[k]; } return a; }
window.WAVE = {
  data: DATA,
  update(patch) {
    const before = lvIdx();
    merge(DATA, patch || {});
    if (!patch || !patch.updatedAt) DATA.updatedAt = Date.now();
    if (lvIdx() > before) state.acked = false;
    render();
  }
};

fromHash();
render();
